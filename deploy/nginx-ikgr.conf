# ============================================
# IKGR 知识图谱系统 - Nginx 配置
# 域名：seventeen17.com.cn
# 部署路径：/etc/nginx/sites-available/ikgr
# ============================================

server {
    listen 80;
    server_name seventeen17.com.cn www.seventeen17.com.cn;

    # 前端静态文件目录
    root /opt/ikgr/frontend;
    index index.html;

    # 日志配置
    access_log /var/log/nginx/ikgr_access.log;
    error_log /var/log/nginx/ikgr_error.log;

    # Gzip 压缩（提升加载速度）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript
        application/x-javascript
        image/svg+xml;

    # 前端路由（Vue/uni-app history 模式支持）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 FastAPI 后端
    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如后续需要实时功能）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置（AI 问答可能需要较长时间）
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # 静态资源缓存策略（30天）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 禁止访问隐藏文件（.env, .git 等）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # robots.txt
    location = /robots.txt {
        log_not_found off;
        access_log off;
        return 200 "User-agent: *\nDisallow: /api/\n";
        add_header Content-Type text/plain;
    }
}

# HTTPS 配置（由 certbot 自动添加，无需手动配置）
# certbot --nginx -d seventeen17.com.cn -d www.seventeen17.com.cn
# 会自动添加 SSL 配置和 HTTP 到 HTTPS 的重定向
